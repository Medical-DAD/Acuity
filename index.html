</style></head><body><header class="top"><div class="topbar-left"><div><b style="font-size:21px;letter-spacing:-.5px">✦ Acuity</b><div class="tiny" id="appSubtitle">Dose Calculator · Clinical reference</div></div></div><button id="langBtn" onclick="toggleLang()">العربية</button></header><main class="content"><div class="safetybanner" id="safetyBanner"></div><div id="page"></div></main><script>
const T=(en,ar)=>state.lang==='ar'?ar:en;
const sections=[['home','⌂','Overview','الرئيسية'],['throat','♧','Sore throat','التهاب الحلق'],['aom','◉','Acute otitis media','التهاب الأذن الوسطى'],['sinus','◇','Rhinosinusitis','التهاب الجيوب الأنفية'],['cap','◈','Pneumonia / CRB65','الالتهاب الرئوي / CRB65'],['bronch','☁','Acute cough / bronchitis','السعال الحاد / التهاب القصبات'],['uti','◧','Urinary infections','عدوى المسالك البولية'],['gi','◌','Gastrointestinal infection','العدوى الهضمية'],['library','▣','Antimicrobial treatment reference','دليل الخيارات العلاجية المضادة للميكروبات'],['dose','▦','Dose Calculator','حاسبة الجرعات'],['sources','▤','Guidelines','الإرشادات الطبية']];
const state={lang:'en',view:'dose',score:'mcisaac',medFilter:'all',navOpen:false};
const refs={strep:['CDC — Group A Streptococcal Pharyngitis','https://www.cdc.gov/group-a-strep/hcp/clinical-guidance/strep-throat.html'],aom:['AAP — Acute Otitis Media','https://publications.aap.org/pediatrics/article/131/3/e964/30912/'],cap:['NICE NG250 — Pneumonia','https://www.nice.org.uk/guidance/ng250/chapter/recommendations'],uti:['NICE NG109 — Lower UTI','https://www.nice.org.uk/guidance/ng109/chapter/Recommendations'],gi:['IDSA — Infectious Diarrhea','https://www.idsociety.org/practice-guideline/infectious-diarrhea']};
const meds=[
['Amoxicillin','أموكسيسيلين','Respiratory, pharyngitis, AOM','تنفسي، حلق، أذن','Established guideline-supported role for confirmed GAS and appropriately selected AOM/CAP','خيار مدعوم بالإرشادات لحالات مختارة من عدوى الحلق والأذن والجهاز التنفسي'],
['Amoxicillin/clavulanate','أموكسيسيلين/كلافولانات','AOM, sinusitis, respiratory','الأذن، الجيوب، التنفسي','Guideline-supported option for selected indications and patient circumstances; confirm clinical need','خيار مدعوم بالإرشادات في حالات سريرية مختارة بحسب تشخيص المريض'],
['Penicillin V','بنسلين V','Confirmed GAS pharyngitis','التهاب الحلق بالعقديات المؤكد','Established narrow-spectrum option when GAS pharyngitis is confirmed','خيار ضيق الطيف للحالات المؤكدة من التهاب الحلق بالعقديات'],
['Cefdinir','سيفدينير','AOM, selected respiratory infections','التهاب الأذن وبعض العدوى التنفسية','Alternative in selected circumstances; verify local approval and susceptibility','بديل لبعض الحالات وفق النشرة والحساسية'],
['Cefixime','سيفيكسيم','Selected UTI or other susceptible infections','بعض عدوى المسالك بحسب الحساسية','Role depends on the infection site, susceptibility evidence and local guidance','يتحدد دوره بحسب موضع العدوى ونتائج الحساسية والإرشادات المحلية'],
['Cefuroxime','سيفوروكسيم','AOM, respiratory, UTI','الأذن، التنفسي، البولي','Potential alternative when indicated and locally approved','بديل محتمل حسب الدواعي المعتمدة'],
['Azithromycin','أزيثرومايسين','Selected atypical respiratory pathogens; allergy alternatives','مسببات تنفسية غير نمطية وبعض البدائل','Macrolide resistance and pathogen coverage must be considered','تؤخذ المقاومة وتغطية المسببات بعين الاعتبار'],
['Doxycycline','دوكسيسيكلين','Selected adult respiratory infections','بعض عدوى الجهاز التنفسي للبالغين','Adult alternative where appropriate; assess pregnancy/age restrictions','بديل لبعض البالغين مع مراعاة الحمل والعمر'],
['Nitrofurantoin','نيتروفورانتوين','Lower uncomplicated UTI','عدوى المسالك البولية السفلية','Guideline-supported for selected lower UTI; does not achieve appropriate renal tissue exposure for pyelonephritis','خيار لالتهاب المثانة وفق الإرشادات؛ لا يحقق التعرض المناسب في نسيج الكلى لعلاج التهاب الحويضة والكلية'],
['Fosfomycin','فوسفوميسين','Uncomplicated lower UTI','التهاب المثانة غير المعقد','Selected guideline-supported option; check local susceptibility','خيار بحسب الإرشادات والحساسية المحلية'],
['Trimethoprim/sulfamethoxazole','تريميثوبريم/سلفاميثوكسازول','Selected UTI and pathogen-specific infections','بعض عدوى المسالك والعدوى المحددة','Use when susceptibility/local resistance supports it','يستخدم عند توافر حساسية مناسبة'],
['Ciprofloxacin','سيبروفلوكساسين','Selected complicated UTI, pyelonephritis, GI pathogens','عدوى بولية معقدة وبعض المسببات الهضمية','Reserve for appropriate indications; important fluoroquinolone safety restrictions','يُحفظ للدواعي المناسبة مع مراعاة تحذيرات الفلوروكينولون'],
['Levofloxacin','ليفوفلوكساسين','Selected CAP, complicated UTI, pyelonephritis','بعض حالات الالتهاب الرئوي وعدوى المسالك المعقدة','Reserved alternative with class-specific serious adverse-effect considerations','بديل محدود مع تحذيرات السلامة الخاصة بالفئة'],
['Metronidazole','ميترونيدازول','Certain anaerobic/protozoal GI infections','بعض العدوى اللاهوائية والطفيليات المعوية','Not indicated for routine viral gastroenteritis or nonspecific watery diarrhea','ليس علاجاً روتينياً للإسهال الفيروسي أو المائي غير المحدد'],
['Oral rehydration solution','محلول الإماهة الفموية','Acute diarrheal illness','الإسهال الحاد','Cornerstone of fluid and electrolyte replacement','أساس تعويض السوائل والشوارد']
];
const medicinesFor={throat:['Penicillin V','Amoxicillin','Amoxicillin/clavulanate','Azithromycin'],aom:['Amoxicillin','Amoxicillin/clavulanate','Cefdinir','Cefuroxime'],sinus:['Amoxicillin/clavulanate','Amoxicillin','Doxycycline','Levofloxacin'],cap:['Amoxicillin','Doxycycline','Azithromycin','Amoxicillin/clavulanate','Levofloxacin'],bronch:[],uti:['Nitrofurantoin','Fosfomycin','Trimethoprim/sulfamethoxazole','Cefixime','Ciprofloxacin','Levofloxacin'],gi:['Oral rehydration solution','Azithromycin','Metronidazole','Ciprofloxacin']};
function draw(){document.documentElement.lang=state.lang;document.body.dir=state.lang==='ar'?'rtl':'ltr';document.getElementById('langBtn').textContent=T('العربية','English');document.getElementById('appSubtitle').textContent=T('Dose Calculator · Clinical reference','حاسبة الجرعات · مرجع سريري');document.getElementById('safetyBanner').textContent=T('EDUCATIONAL DEMO: Verify the exact approved product label, indication, allergy, kidney function, age, formulation, local guidance and prescription before any treatment. This calculator is not independently clinically validated. No patient information is stored.','نموذج تعليمي: تحقق من النشرة المعتمدة والتركيبة والتشخيص والحساسية ووظائف الكلى والعمر والإرشادات المحلية والوصفة قبل أي علاج. لم تُعتمد الحاسبة سريرياً. لا تُخزن بيانات المرضى.');document.getElementById('page').innerHTML=dose();labelChoices();}
function go(v){state.view=v;state.navOpen=false;draw();window.scrollTo({top:0,behavior:'smooth'})}
function toggleMenu(){state.navOpen=!state.navOpen;draw()}
function closeMenu(){state.navOpen=false;draw()}
function toggleLang(){state.lang=state.lang==='en'?'ar':'en';draw()}
function tile(key,ico,en,ar,desc,ardesc){return `<button class="tile" onclick="go('${key}')"><div class="emoji">${ico}</div><h3>${T(en,ar)}</h3><p class="muted">${T(desc,ardesc)}</p><span class="pill">${T('Open module →','افتح الوحدة ←')}</span></button>`}
function home(){return `<div class="hero"><div class="kicker">ACUITY • CLINICAL DECISION SUPPORT</div><h1>${T('Clear decisions, fewer clicks.','قرارات أوضح بخطوات أقل.')}</h1><p>${T('Select the presentation. The appropriate validated assessment is selected automatically; treatment evidence is displayed only within the relevant clinical context.','اختر الحالة. يتم اختيار التقييم المعتمد تلقائياً وتعرض الخيارات العلاجية بحسب السياق السريري.')}</p></div><div class="panel"><h2>${T('What is the patient presenting with?','ما هي الشكوى الرئيسية للمريض؟')}</h2><div class="fieldgrid"><div class="field"><label>${T('Clinical presentation','الحالة السريرية')}</label><select id="quickCondition" onchange="document.getElementById('quickOpen').disabled=!this.value"><option value="">${T('Choose infection / syndrome','اختر العدوى أو المتلازمة')}</option>${sections.filter(x=>['throat','aom','sinus','cap','bronch','uti','gi'].includes(x[0])).map(x=>`<option value="${x[0]}">${T(x[2],x[3])}</option>`).join('')}</select></div><div class="field" style="display:flex;align-items:end"><button class="btn primary" id="quickOpen" disabled onclick="go(document.getElementById('quickCondition').value)">${T('Start assessment →','ابدأ التقييم ←')}</button></div></div><p class="tiny">${T('The app does not allow choosing a different scoring system for the same patient. Scores only appear when appropriate to the condition and age.','لا تتطلب الأداة اختيار المقياس؛ تعرض التقييم المناسب للحالة والعمر فقط.')}</p></div><div class="panel"><h3>${T('Other tools','أدوات أخرى')}</h3><div class="tabs"><button onclick="go('dose')">${T('Dose Calculator','حاسبة الجرعات')}</button><button onclick="go('library')">${T('Evidence & medication reference','مرجع الأدلة والأدوية')}</button><button onclick="go('sources')">${T('Guidelines','الإرشادات')}</button></div></div>`}
const check=(id,en,ar)=>`<label class="check"><input type="checkbox" id="${id}" onchange="update()"><span>${T(en,ar)}</span></label>`;
const select=(id,en,ar,opts)=>`<div class="field"><label for="${id}">${T(en,ar)}</label><select id="${id}" onchange="update()">${opts.map(([v,e,a])=>`<option value="${v}">${T(e,a)}</option>`).join('')}</select></div>`;
const num=(id,en,ar,min,max,value)=>`<div class="field"><label for="${id}">${T(en,ar)}</label><input type="number" id="${id}" min="${min}" max="${max}" value="${value}" oninput="update()"></div>`;
const checked=id=>!!document.getElementById(id)?.checked;const val=id=>document.getElementById(id)?.value;const n=id=>+val(id);
function resultPanel(){return `<div class="panel" style="position:sticky;top:100px"><h3>${T('Clinical interpretation','التفسير السريري')}</h3><div class="res" id="result"></div><hr class="divider"><h3>${T('Treatment options & clinical role','الخيارات العلاجية والدور السريري')}</h3><div id="medsShort"></div><hr class="divider"><h3>${T('Likely pathogens · case-specific differential','المسببات المحتملة حسب الحالة')}</h3><div id="pathogenPanel" class="pathogens"></div></div>`}
function linkRef(k){let r=refs[k];return `<a target="_blank" rel="noopener noreferrer" href="${r[1]}">${r[0]} ↗</a>`}
function shortMeds(key){let list=medicinesFor[key]||[];let m=list.map(z=>meds.find(x=>x[0]===z));document.getElementById('medsShort').innerHTML=`<p class="tiny">${T('Context only. Selection depends on confirmed indication, resistance, allergies, age, pregnancy and clinical condition.','للمرجعية فقط. الاختيار يعتمد على الدواعي والمقاومة والحساسية والعمر والحمل والحالة السريرية.')}</p>${m.length?m.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #e5edf2"><b>${T(x[0],x[1])}</b><div class="tiny">${T(x[4],x[5])}</div></div>`).join(''):`<span class="pill amber">${T('Routine antibiotics generally not recommended','المضادات الحيوية غير موصى بها عادةً')}</span>`}<p class="tiny">${T('Options are not ranked. Review clinical role, safety, approval status and susceptibility before prescribing.','ليس ترتيباً للوصف الطبي. راجع الدليل الكامل للاحتياطات.')}</p>`}
function framework(title,subtitle,fields,key,source){return `<div class="hero"><div class="kicker">CLINICAL ASSESSMENT</div><h1>${title}</h1><p>${subtitle}</p></div><div class="two"><div><div class="panel">${fields}</div><div class="panel"><b>${T('Guideline reference','المرجع العلمي')}</b><p class="source">${linkRef(source)}</p></div></div>${resultPanel()}</div><div class="panel"><h3>${T('Critical reminder','تنبيه أساسي')}</h3><p>${T('This is a triage aid, not a diagnosis or a prescription. Serious illness, red flags, treatment failure and special populations require clinician assessment.','هذه أداة مساعدة للتقييم وليست تشخيصاً أو وصفة. يلزم تقييم الطبيب عند شدة المرض وعلامات الإنذار وفشل العلاج والفئات الخاصة.')}</p></div>`}
function throat(){let fields=`<h2>${T('Sore throat — scoring and testing','التهاب الحلق — التقييم والفحوص')}</h2><div class="fieldgrid">${num('age','Age (years)','العمر (سنوات)',0,110,22)}<div class="field"><label>${T('Assessment method','طريقة التقييم')}</label><div class="pill">${T('Automatically selected: age-adjusted McIsaac (age ≥3)','اختيار تلقائي: ماك آيزاك المعدل (عمر ٣ سنوات فأكثر)')}</div></div></div><p class="muted">${T('Centor/McIsaac items','بنود سنتور وماك آيزاك')}</p><div class="checks">${check('fever','Fever or history of fever','حمى أو تاريخ حمى')}${check('exudate','Tonsillar exudate or swelling','قيح أو تورم اللوزتين')}${check('nodes','Tender anterior cervical nodes','ألم العقد الرقبية الأمامية')}${check('noCough','Absence of cough','غياب السعال')}</div><hr class="divider"><div class="checks">${check('viral','Clear viral features (rhinorrhea, oral ulcers, hoarseness)','أعراض فيروسية واضحة مثل الزكام أو تقرحات الفم أو بحة الصوت')}${check('thred','Red flags: airway compromise, drooling, toxic appearance','علامات إنذار: انسداد مجرى الهواء أو سيلان اللعاب أو اعتلال شديد')}</div>`;return framework(T('Tonsillopharyngitis','التهاب اللوزتين والبلعوم'),T('Age-adjusted McIsaac is applied automatically when suitable; testing confirms GAS.','يُطبَّق مقياس ماك آيزاك تلقائياً حسب العمر، ويؤكد الاختبار العدوى بالعقديات.'),fields,'throat','strep')}
function aom(){let fields=`<h2>${T('Otoscopy-first assessment','التقييم المعتمد على فحص الأذن')}</h2><div class="fieldgrid">${num('ageMonths','Age (months)','العمر (بالأشهر)',0,216,20)}${select('bulge','Tympanic membrane appearance','مظهر غشاء الطبل',[['none','No bulging','لا يوجد انتفاخ'],['mild','Mild bulging','انتفاخ خفيف'],['marked','Moderate/severe bulging','انتفاخ متوسط أو شديد'],['unknown','Not examined / uncertain','لم يُفحص / غير مؤكد']])}${select('effusion','Middle ear effusion','انصباب الأذن الوسطى',[['unknown','Not confirmed','غير مؤكد'],['yes','Confirmed','مؤكد'],['no','Absent','غير موجود']])}${select('laterality','Laterality','الجهة المصابة',[['uni','Unilateral','أحادي الجانب'],['bi','Bilateral','ثنائي الجانب']])}</div><div class="checks">${check('otorrhea','New otorrhea not from otitis externa','سيلان حديث غير ناجم عن التهاب الأذن الخارجية')}${check('recentPain','Recent onset ear pain under 48 h','ألم أذن حديث أقل من ٤٨ ساعة')}${check('intenseRed','Intense tympanic membrane erythema','احمرار شديد في غشاء الطبل')}${check('severePain','Moderate/severe pain or pain ≥48 h','ألم متوسط أو شديد أو مستمر ٤٨ ساعة فأكثر')}${check('fever39','Temperature ≥39°C','حرارة ٣٩°م أو أكثر')}${check('aomConj','Concurrent purulent conjunctivitis','التهاب الملتحمة القيحي المتزامن')}${check('aomRed','Mastoid swelling, toxic appearance, neurologic signs','تورم خلف الأذن أو اعتلال شديد أو أعراض عصبية')}</div>`;return framework(T('Acute Otitis Media','التهاب الأذن الوسطى الحاد'),T('There is no recommended Centor-like probability score for routine AOM diagnosis. Use AAP otoscopic criteria and severity.','لا يوجد مقياس احتمالية موصى به مماثل لسنتور لالتهاب الأذن الوسطى. استخدم معايير الفحص والشدة.'),fields,'aom','aom')}
function sinus(){let fields=`<h2>${T('Bacterial rhinosinusitis features','علامات التهاب الجيوب البكتيري')}</h2><div class="checks">${check('persist','Symptoms persist ≥10 days without improvement','أعراض تستمر ١٠ أيام أو أكثر دون تحسن')}${check('double','Symptoms worsen after initial improvement (double-worsening)','تفاقم بعد تحسن أولي')}${check('severeSinus','High fever with purulent discharge/facial pain at onset for ≥3 days','حمى مرتفعة مع مفرزات قيحية أو ألم وجهي ٣ أيام على الأقل')}${check('sinRed','Orbital swelling, severe headache, neurologic signs','تورم حول العين أو صداع شديد أو علامات عصبية')}</div><div class="alert">${T('Colored nasal discharge alone does not confirm bacterial sinusitis.','لون الإفرازات وحده لا يؤكد التهاب الجيوب البكتيري.')}</div>`;return framework(T('Acute Rhinosinusitis','التهاب الجيوب الأنفية الحاد'),T('Pattern-based triage; no validated percentage calculator is provided here.','التقييم وفق نمط الأعراض ولا تعرض نسبة احتمالية رقمية دون دليل.'),fields,'sinus','strep')}
function cap(){let fields=`<h2>${T('CRB65 — adult severity tool','مقياس CRB65 للبالغين')}</h2><p class="tiny">${T('Only after clinical pneumonia assessment. This predicts 30-day mortality risk, NOT bacterial probability.','يستخدم بعد تقييم الالتهاب الرئوي سريرياً. يتنبأ بخطر الوفاة خلال ٣٠ يوماً، لا باحتمالية الجرثومة.')}</p><div class="checks">${check('conf','New confusion','تشوش ذهني حديث')}${check('rr','Respiratory rate ≥30/min','معدل التنفس ٣٠/دقيقة أو أكثر')}${check('bp','Systolic BP <90 or diastolic ≤60 mmHg','الضغط الانقباضي أقل من ٩٠ أو الانبساطي ٦٠ أو أقل')}${check('old','Age ≥65 years','العمر ٦٥ سنة أو أكثر')}${check('capRed','Hypoxemia, sepsis signs or respiratory distress','نقص الأكسجة أو علامات إنتان أو ضائقة تنفسية')}</div>`;return framework(T('Community-acquired Pneumonia','الالتهاب الرئوي المكتسب من المجتمع'),T('Risk stratification and site-of-care support for adult suspected CAP.','تقدير الشدة ودعم قرار مكان الرعاية لدى البالغين.'),fields,'cap','cap')}
function bronch(){let fields=`<h2>${T('Assess uncomplicated acute cough','تقييم السعال الحاد غير المعقد')}</h2><div class="checks">${check('bronFever','Fever or persistent systemic illness','حمى أو أعراض عامة مستمرة')}${check('bronTachy','Tachypnea or marked tachycardia','تسرع التنفس أو القلب')}${check('bronChest','Focal chest signs / suspected pneumonia','علامات صدرية موضعية أو شك بالتهاب رئوي')}${check('bronRed','Dyspnea, hypoxemia, hemoptysis, severe illness','ضيق نفس أو نقص أكسجة أو نفث دم أو اعتلال شديد')}</div>`;return framework(T('Acute Cough / Bronchitis','السعال الحاد / التهاب القصبات'),T('Most uncomplicated acute bronchitis is viral; symptoms should trigger examination when pneumonia is possible.','معظم التهاب القصبات الحاد غير المعقد فيروسي؛ تستلزم علامات الالتهاب الرئوي الفحص.'),fields,'bronch','cap')}
function uti(){let fields=`<h2>${T('Urinary syndrome and risk assessment','نوع العدوى البولية وعوامل الخطورة')}</h2><div class="fieldgrid">${select('utiGroup','Patient group','فئة المريض',[['woman','Adult nonpregnant woman','امرأة بالغة غير حامل'],['preg','Pregnant','حامل'],['man','Adult man','رجل بالغ'],['child','Child','طفل']])}</div><div class="checks">${check('dysuria','Dysuria','عسر التبول')}${check('frequency','Frequency / urgency','تكرار التبول أو الإلحاح')}${check('hematuria','Hematuria','دم في البول')}${check('vaginal','Vaginal discharge / irritation','مفرزات مهبلية أو تهيج')}${check('flank','Flank pain or costovertebral tenderness','ألم الخاصرة أو الزاوية الضلعية الفقرية')}${check('utiFever','Fever / rigors','حمى أو قشعريرة')}${check('utiRed','Sepsis signs, vomiting, inability to hydrate','علامات إنتان أو إقياء أو تعذر تعويض السوائل')}</div>`;return framework(T('Urinary Tract Infection','عدوى المسالك البولية'),T('Symptom-based assessment; no universal bacterial probability applies across age, sex and pregnancy groups.','تقييم بحسب الأعراض، ولا توجد نسبة احتمالية واحدة تناسب جميع الأعمار والجنس والحمل.'),fields,'uti','uti')}
function gi(){let fields=`<h2>${T('Diarrheal illness assessment','تقييم الإسهال والعدوى الهضمية')}</h2><div class="checks">${check('giWater','Watery stools','إسهال مائي')}${check('giBlood','Bloody stools','إسهال دموي')}${check('giFever','Fever','حمى')}${check('giTravel','Recent international travel','سفر دولي حديث')}${check('giLong','Duration ≥14 days','استمرار ١٤ يوماً أو أكثر')}${check('giImmune','Immunocompromised','ضعف المناعة')}${check('giRed','Severe dehydration, shock or severe abdominal pain','جفاف شديد أو صدمة أو ألم بطني شديد')}</div>`;return framework(T('Acute Gastrointestinal Infection','العدوى الهضمية الحادة'),T('Prioritize dehydration assessment; most uncomplicated watery diarrhea does not warrant empiric antibiotics.','تعطى الأولوية للجفاف؛ غالبية حالات الإسهال المائي غير المعقد لا تتطلب مضادات حيوية تجريبية.'),fields,'gi','gi')}
function update(){let key=state.view;let html='';if(key==='throat'){let age=n('age'),cent=['fever','exudate','nodes','noCough'].filter(checked).length;let score=cent+(age>=3&&age<=14?1:age>=45?-1:0);let suggestion=score<=1?T('Lower probability of GAS; consider testing according to local pathway.','احتمالية أقل للعقديات؛ قيّم الحاجة للفحص حسب المسار المحلي.'):score<=3?T('Intermediate GAS likelihood: rapid antigen testing is often appropriate.','احتمالية متوسطة: يمكن إجراء اختبار مستضد سريع.'):T('Higher GAS likelihood: confirm with testing where indicated; score alone does not diagnose.','احتمالية أعلى: أكد بالفحص عند الاستطباب، فالدرجة وحدها لا تشخص.');html=`${age<3?`<div class="alert">${T('Not validated for children under 3: no scoring-based risk categorization. GAS pharyngitis is uncommon in this group.','المقياس غير معتمد لمن هم دون ثلاث سنوات.')}</div>`:`<div class="pill">${T('Auto: Modified Centor / McIsaac','تلقائي: سنتور المعدل / ماك آيزاك')}</div><strong class="num">${score}</strong><p>${suggestion}</p>${checked('viral')?`<div class="alert">${T('Clear viral symptoms: GAS testing is generally unnecessary.','أعراض فيروسية واضحة: اختبار العقديات غير ضروري عادةً.')}</div>`:''}${checked('thred')?`<div class="alert danger">${T('Urgent clinical assessment: red flags override scoring.','تقييم عاجل: علامات الإنذار تتقدم على المقياس.')}</div>`:''}<p class="tiny">${T('Score stratifies pretest likelihood; no universal individual bacterial probability percentage is inferred. For children aged ≥3, consider culture after a negative RADT when indicated.','المقياس يصنف الاحتمال قبل الفحص، دون استنتاج نسبة فردية دقيقة. لدى الأطفال من ٣ سنوات يمكن تأكيد الفحص السريع السلبي بالزرع عند الحاجة.')}</p>`}`;}else if(key==='aom'){let age=n('ageMonths'),bulge=val('bulge'),eff=val('effusion'),diag=checked('otorrhea')||eff==='yes'&&(bulge==='marked'||bulge==='mild'&&(checked('recentPain')||checked('intenseRed'))),sev=checked('severePain')||checked('fever39');let msg=eff==='no'&&!checked('otorrhea')?T('AOM not established: no middle-ear effusion.','التهاب الأذن الوسطى غير مثبت لغياب الانصباب.'):diag?T('Findings meet high-specificity AAP diagnostic criteria for AOM. This does not identify the organism.','العلامات تستوفي معايير AAP لتشخيص التهاب الأذن الوسطى، لكنها لا تحدد المسبب.') :T('AOM not confirmed; otoscopy/effusion assessment is needed.','التهاب الأذن غير مؤكد ويلزم تقييم الغشاء والانصباب.');let manage=diag?(sev||age<6||age<24&&val('laterality')==='bi'||checked('otorrhea')?T('Clinical assessment for immediate antibiotics is generally favored in these circumstances.','يفضل تقييم الحاجة للمضاد الحيوي المباشر في هذه الحالات.'):T('If nonsevere and follow-up is reliable, observation may be an option with 48–72 h reassessment.','إذا لم تكن الحالة شديدة وتوفرت المتابعة، يمكن النظر في المراقبة وإعادة التقييم خلال ٤٨–٧٢ ساعة.')):'';html=`<div class="pill">${T('Criteria-based diagnosis — no probability %','تشخيص قائم على المعايير — دون نسبة مئوية')}</div><h2>${msg}</h2><p>${manage}</p>${checked('aomRed')?`<div class="alert danger">${T('Urgent assessment for complications is needed.','يلزم تقييم عاجل للمضاعفات.')}</div>`:''}`;}else if(key==='sinus'){let count=['persist','double','severeSinus'].filter(checked).length;html=`<div class="pill">${T('Pattern assessment','التقييم بحسب النمط')}</div><h2>${count?T('Features compatible with possible acute bacterial rhinosinusitis','سمات تتوافق مع احتمال التهاب جيوب بكتيري حاد'):T('Typical bacterial patterns not documented','لم تُوثق أنماط بكتيرية نموذجية')}</h2><p>${T('Use time course and examination. This is not a validated numeric probability.','يعتمد القرار على المسار الزمني والفحص ولا يمثل نسبة احتمال رقمية معتمدة.')}</p>${checked('sinRed')?`<div class="alert danger">${T('Urgent evaluation of possible orbital/intracranial complications.','تقييم عاجل لاحتمال مضاعفات عينية أو داخل القحف.')}</div>`:''}`;}else if(key==='cap'){let score=['conf','rr','bp','old'].filter(checked).length;html=`<div class="pill">CRB65 · ${T('Severity, not bacterial probability','مقياس الشدة وليس احتمال العدوى البكتيرية')}</div><strong class="num">${score}/4</strong><h3>${score===0?T('Low mortality risk (<1%)','خطورة وفيات منخفضة (أقل من ١٪)'):score<=2?T('Intermediate mortality risk (1–10%)','خطورة وفيات متوسطة (١–١٠٪)'):T('High mortality risk (>10%)','خطورة وفيات مرتفعة (أكثر من ١٠٪)')}</h3><p>${score>=2?T('Consider hospital referral (NICE).','ضع إحالة المستشفى في الاعتبار وفق NICE.'):score===1?T('Clinical judgment and same-day care pathway review recommended.','يلزم الحكم السريري وتقييم مسار الرعاية العاجلة.'):T('Consider community management only if otherwise clinically stable.','يمكن النظر في العلاج المجتمعي فقط عند استقرار الحالة سريرياً.')}</p>${checked('capRed')?`<div class="alert danger">${T('Urgent hospital-level assessment regardless of CRB65 score.','تقييم عاجل بالمستشفى بغض النظر عن درجة CRB65.')}</div>`:''}`;}else if(key==='bronch'){let concern=['bronFever','bronTachy','bronChest','bronRed'].some(checked);html=`<h2>${concern?T('Further assessment to exclude pneumonia or serious illness','يلزم تقييم إضافي لاستبعاد الالتهاب الرئوي أو مرض خطير'):T('Uncomplicated acute bronchitis pattern','نمط التهاب قصبات حاد غير معقد')}</h2><p>${T('Sputum color does not prove bacterial etiology; routine antibiotics are not advised for uncomplicated acute bronchitis.','لون البلغم لا يثبت سبباً بكتيرياً؛ المضادات الحيوية غير موصى بها روتينياً لالتهاب القصبات غير المعقد.')}</p>`;}else if(key==='uti'){let f=['dysuria','frequency','hematuria'].filter(checked).length,upper=checked('flank')||checked('utiFever'),group=val('utiGroup');html=`<h2>${upper?T('Possible upper/complicated UTI','احتمال عدوى بولية علوية أو معقدة'):f>=2&&!checked('vaginal')&&group==='woman'?T('Typical lower UTI symptoms in a nonpregnant adult woman','أعراض نموذجية لالتهاب المثانة لدى امرأة بالغة غير حامل'):T('UTI uncertain — assess differential and testing','عدوى المسالك غير مؤكدة — يلزم تقييم البدائل والفحوص')}</h2><p>${group!=='woman'?T('This patient group requires a different diagnostic/culture pathway.','تتطلب هذه الفئة مساراً تشخيصياً وزرعاً مختلفاً.'):T('Review vaginal symptoms, prior cultures and local susceptibility.','راجع الأعراض المهبلية والزرع السابق والحساسية المحلية.')}</p>${upper||checked('utiRed')?`<div class="alert danger">${T('Prompt clinical assessment, culture and escalation as indicated.','يلزم تقييم سريع وزرع وتصعيد الرعاية عند الحاجة.')}</div>`:''}`;}else if(key==='gi'){let red=checked('giRed'),infl=checked('giBlood')||checked('giFever'),prolong=checked('giLong');html=`<h2>${red?T('Urgent dehydration/severe illness assessment','تقييم عاجل للجفاف أو شدة المرض'):infl?T('Inflammatory/invasive infection is possible','احتمال عدوى التهابية أو غازية'):prolong?T('Persistent diarrhea: investigate causes','إسهال مستمر: يجب تحري الأسباب'):T('Supportive care often appropriate','العلاج الداعم مناسب في كثير من الحالات')}</h2><p>${T('Oral rehydration is a priority. Empiric antibiotics are usually not recommended for uncomplicated acute watery diarrhea. Bloody diarrhea warrants evaluation, including STEC risk.','الإماهة الفموية أولوية. المضادات التجريبية غالباً غير موصى بها للإسهال المائي غير المعقد. الإسهال الدموي يستلزم التقييم بما في ذلك احتمال الإشريكية المنتجة لذيفان شيغا.')}</p>`;}let target=document.getElementById('result');if(target)target.innerHTML=html;shortMeds(key)}
function library(){return `<div class="hero"><div class="kicker">ANTIMICROBIAL REFERENCE</div><h1>${T('Indication-led medication library','دليل الأدوية حسب دواعي الاستعمال')}</h1><p>${T('Balanced coverage of common agents, including Antimicrobial options based on clinical evidence, not manufacturer. Not an empirical prescription engine.','عرض متوازن للأدوية الشائعة بما فيها جزيئات دار الدواء والبدائل المعيارية، دون ترتيب ترويجي أو وصف تلقائي.')}</p></div><div class="panel"><div class="fieldgrid"><div class="field"><label>${T('Filter by clinical area','تصفية حسب المجال')}</label><select id="medArea" onchange="filterMed()"><option value="all">${T('All medicines','جميع الأدوية')}</option>${Object.keys(medicinesFor).filter(k=>medicinesFor[k].length).map(k=>`<option value="${k}">${T(sections.find(s=>s[0]===k)?.[2]||k,sections.find(s=>s[0]===k)?.[3]||k)}</option>`).join('')}</select></div><div class="field"><label>${T('Search molecule','ابحث عن الجزيء')}</label><input id="medSearch" placeholder="amoxicillin, cefixime ..." oninput="filterMed()"></div></div><div id="medList"></div><div class="alert">${T('Fluoroquinolones such as ciprofloxacin and levofloxacin require special safety and antimicrobial stewardship considerations. Narrowest effective therapy is preferred when an antibiotic is indicated.','تتطلب الفلوروكينولونات مثل سيبروفلوكساسين وليفوفلوكساسين مراعاة تحذيرات السلامة وترشيد استخدام المضادات. يفضل العلاج الأضيق الفعال عند استطباب المضاد الحيوي.')}</div></div>`}
function filterMed(){let area=val('medArea'),q=(val('medSearch')||'').toLowerCase(),list=meds.filter(m=>(area==='all'||medicinesFor[area]?.includes(m[0]))&&m[0].toLowerCase().includes(q));document.getElementById('medList').innerHTML=`<div class="tablewrap"><table><thead><tr><th>${T('Molecule','الجزيء')}</th><th>${T('Clinical area','المجال السريري')}</th><th>${T('Stewardship / clinical context','السياق السريري وترشيد الاستخدام')}</th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${T(m[0],m[1])}</b></td><td>${T(m[2],m[3])}</td><td>${T(m[4],m[5])}</td></tr>`).join('')}</tbody></table></div>`}

function dose(){return `<div class="hero"><div class="kicker">FDA-LABELLED PEDIATRIC REGIMENS</div><h1>${T('Dose Calculator','حاسبة الجرعات')}</h1><p>${T('One consultation workflow: indication → labelled regimen → weight and age → exact bottle strength → mL per administration. US FDA labels are cited individually. EMA regimens are not assumed equivalent.','خطوات سريعة: الحالة ← نظام الجرعات الوارد بالنشرة ← العمر والوزن ← تركيز العبوة ← الملليلترات لكل جرعة. مراجع FDA مرفقة لكل نظام.')}</p></div><div class="two"><div class="panel"><h2>${T('1 · Select infection and medicine','١ · حدد العدوى والدواء')}</h2><div class="fieldgrid"><div class="field"><label>${T('Infection','العدوى')}</label><select id="labelDx" onchange="labelChoices()">${diagnosisList.map(x=>`<option value="${x[0]}">${T(x[1],x[2])}</option>`).join('')}</select></div><div class="field"><label>${T('Approved-label regimen','نظام الجرعة بالنشرة')}</label><select id="labelRegimen" onchange="labelStrengths()"></select></div></div><h2>${T('2 · Patient and bottle','٢ · المريض والعبوة')}</h2><div class="fieldgrid"><div class="field"><label>${T('Age in months','العمر بالأشهر')}</label><input id="labelAge" type="number" min="0" step="1" placeholder="e.g. 24" oninput="computeLabelDose()"></div><div class="field"><label>${T('Weight (kg)','الوزن (كغ)')}</label><input id="labelWeight" type="number" min="0" step="0.1" placeholder="e.g. 15" oninput="computeLabelDose()"></div><div class="field"><label>${T('Exact bottle strength · mg / 5 mL','تركيز العبوة الدقيق · ملغ / ٥ مل')}</label><select id="labelStrength" onchange="computeLabelDose()"></select></div></div><label class="check"><input id="labelConfirmed" type="checkbox" onchange="computeLabelDose()"><span>${T('Clinician confirms infection, indication, allergy status, renal function, and exact product formulation have been reviewed.','يؤكد الطبيب مراجعة التشخيص ودواعي الاستعمال والحساسية والكلى والتركيبة.')}</span></label><div class="alert">${T('This is a limited FDA-label lookup, not an automatic prescription. Age limits, maximum daily doses, and formulation matching are checked. Pregnancy, renal impairment, other comorbidities, resistance, local approval and duration still require clinical review.','مرجع محدود للنشرات الأمريكية وليس وصفة تلقائية. تبقى مراجعة الكلى والأمراض والمقاومة والاعتماد المحلي ضرورية.')}</div></div><div class="panel"><h2>${T('3 · Dose and caregiver instructions','٣ · الجرعة وتعليمات ولي الأمر')}</h2><div class="res" aria-live="polite"><p>${T('Volume EACH dose','الحجم لكل جرعة')}</p><div class="doseout" id="labelMl">—</div><p id="labelMg" class="muted"></p><p id="labelFrequency"></p></div><div class="panel" style="margin-top:16px"><b>${T('Caregiver wording · clinician review required','نص لولي الأمر · يلزم مراجعة الطبيب')}</b><p id="labelInstruction" style="font-size:17px;font-weight:700"></p><button class="btn" id="labelCopy" onclick="copyLabelInstruction()" disabled>${T('Copy after review','نسخ بعد المراجعة')}</button></div><div id="labelWarnings" class="alert"></div><p id="labelSource" class="source"></p><p class="tiny">${T('Give liquid medicine with a marked oral syringe. Do not use household spoons. Do not round a dose without assessing measuring accuracy.','استخدم محقنة فموية مدرجة ولا تستخدم ملاعق الطعام. لا تقرب الجرعة دون مراجعة دقة القياس.')}</p></div></div>`}
function labelChoices(){let d=val('labelDx'),a=labelRegimens.filter(x=>x.dx.includes(d));let sel=document.getElementById('labelRegimen');if(!sel)return;sel.innerHTML=a.map(r=>`<option value="${r.id}">${r.drug} — ${r.title}</option>`).join('');labelStrengths()}
function labelStrengths(){let r=labelRegimens.find(x=>x.id===val('labelRegimen')),sel=document.getElementById('labelStrength');if(!r||!sel)return;sel.innerHTML=r.strengths.map(a=>`<option value="${a[0]}">${a.join(' / ')} mg per 5 mL</option>`).join('');computeLabelDose()}
function computeLabelDose(){const r=labelRegimens.find(x=>x.id===val('labelRegimen')),age=Number(val('labelAge')),weight=Number(val('labelWeight')),strength=Number(val('labelStrength')),confirm=checked('labelConfirmed');let out=document.getElementById('labelMl');if(!out||!r)return;let warnings=[];
const ageRaw=val('labelAge'),weightRaw=val('labelWeight');if(!ageRaw||!weightRaw||!(age>0)||!(weight>0))warnings.push(T('Enter valid patient age and weight.','أدخل عمراً ووزناً صحيحين.'));
if(ageRaw&&age<r.min)warnings.push(T('Below the minimum age for this labelled regimen.','العمر أقل من الحد المذكور بالنشرة.'));
if(ageRaw&&age>r.max)warnings.push(T('Outside the pediatric age range represented in this label module.','خارج فئة العمر المتاحة لهذا النظام.'));
if(weightRaw&&weight>=r.limit)warnings.push(T('Weight reaches the threshold where adult dosing or a special dosing table must be checked.','الوزن يتطلب مراجعة جرعة البالغين أو جدول خاص.'));
if(!confirm)warnings.push(T('Doctor confirmation required before caregiver wording is enabled.','يلزم تأكيد الطبيب قبل عرض تعليمات الجرعة.'));
const cap=r.drug==='Cefdinir'?600:r.drug==='Cefixime'?400:Infinity;let daily=Math.min(weight*r.rate,cap);if(weightRaw&&weight*r.rate>cap)warnings.push(T('Maximum daily dose cap applied; verify the source and product.','تم تطبيق الحد الأقصى اليومي؛ راجع المصدر والعبوة.'));
let mg=daily/r.freq,ml=mg*5/strength;const usable=warnings.length===0&&Number.isFinite(ml)&&ml>0&&ml<=50;
if(ml>50)warnings.push(T('Large dose volume: check regimen and product strength.','حجم جرعة كبير: راجع النظام والتركيز.'));
out.textContent=usable?`${+(ml.toFixed(2))} mL`:'—';document.getElementById('labelMg').textContent=usable?`${+(mg.toFixed(1))} mg ${T('per dose','لكل جرعة')} · ${+(daily.toFixed(1))} mg/day`:'';document.getElementById('labelFrequency').textContent=usable?`${r.freq} ${T(r.freq===1?'administration per day':'administrations per day',r.freq===1?'مرة يومياً':'مرتان يومياً')} · ${T(r.days,r.days)}`:'';
const msg=usable?T(`Give ${+(ml.toFixed(2))} mL by mouth ${r.freq===1?'once':'twice'} daily. Regimen: ${r.days}. Only after the doctor confirms this exact formulation, duration and prescription. Use a marked oral syringe.`,`أعطِ ${+(ml.toFixed(2))} مل عن طريق الفم ${r.freq===1?'مرة':'مرتين'} يومياً، وفق تعليمات الطبيب وتأكيد التركيز والمدة. استخدم محقنة فموية مدرجة.`):T('No caregiver instruction until inputs and clinical confirmation are valid.','لا تظهر تعليمات ولي الأمر قبل التحقق من المدخلات وموافقة الطبيب.');
document.getElementById('labelInstruction').textContent=msg;document.getElementById('labelCopy').disabled=!usable;document.getElementById('labelWarnings').innerHTML=`<b>${T('Label-specific cautions','احتياطات خاصة بالنشرة')}:</b> ${r.note}<p>${warnings.join(' ')||T('Clinician review completed; confirm suitability and all prescribing details independently.','تم التأكيد؛ راجع الملاءمة وبقية معلومات الوصفة.')}</p>`;document.getElementById('labelSource').innerHTML=`<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.source} ↗</a>`;
}
function copyLabelInstruction(){if(document.getElementById('labelCopy')?.disabled)return;navigator.clipboard?.writeText(document.getElementById('labelInstruction').textContent).catch(()=>{});}
function updateDose(){let d=n('mgDose'),mg=n('mgConc'),ml=n('mlConc'),freq=n('dosesDay'),out=document.getElementById('doseResult');if(!out)return;
let valid=[d,mg,ml,freq].every(Number.isFinite)&&d>0&&mg>0&&ml>0&&freq>=1&&freq<=6&&Number.isInteger(freq);
let per=valid?d*ml/mg:null;let reliable=per!==null&&per>0&&per<=100&&Number.isFinite(per);
let printed=reliable?Number(per.toFixed(2)).toString():'—';out.textContent=reliable?printed+' mL':'—';
let daily=document.getElementById('doseDaily'),conc=document.getElementById('doseStrength'),msg=document.getElementById('caregiverTxt');
if(!reliable){daily.textContent=T('Check all values. If a dose would exceed 100 mL, recheck the prescription and product strength.','تحقق من جميع القيم. إذا تجاوز الحجم ١٠٠ مل لكل مرة فراجع الجرعة والتركيز.');conc.textContent='';msg.textContent=T('No caregiver instruction until inputs are valid.','لا توجد تعليمات لولي الأمر حتى تصح المدخلات.');return}
let drug=(document.getElementById('drugName')?.value||'').trim();daily.textContent=T('Total calculated volume per day: ','إجمالي الحجم المحسوب يومياً: ')+Number((per*freq).toFixed(2))+' mL';conc.textContent=T('Entered concentration: ','التركيز المدخل: ')+mg+' mg / '+ml+' mL · '+Number((mg/ml).toFixed(2))+' mg/mL';
let en=`${drug?drug+': ':''}Give ${printed} mL by mouth per dose, ${freq} ${freq===1?'time':'times'} per day, only as directed by the clinician. Use an oral syringe. Confirm duration and timing with the prescription.`;
let ar=`${drug?drug+': ':''}أعطِ ${printed} مل بالفم في كل جرعة، ${freq} ${freq===1?'مرة': 'مرات'} يومياً، وفق وصف الطبيب فقط. استخدم محقنة فموية مدرجة. تأكد من مدة العلاج وأوقات الجرعات من الوصفة.`;
msg.textContent=T(en,ar)
}
